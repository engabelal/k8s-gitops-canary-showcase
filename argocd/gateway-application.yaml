apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canary-nginx-gateway
  namespace: argocd
  labels:
    app: canary-nginx
    component: gateway
spec:
  project: canary-project
  source:
    repoURL: 'https://github.com/YOUR_USERNAME/k8s-gitops-canary-showcase.git'
    targetRevision: HEAD
    path: 'k8s-manifests/gateway'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: canary-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
