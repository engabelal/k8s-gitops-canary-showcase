apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-canary-html
  labels:
    app: canary-nginx
    version: canary
data:
  nginx.conf: |
    server {
      listen 80;
      server_name _;
      location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Connection "close";
        expires -1;
      }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>Canary Release | Canary Demo</title>
      <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
      <style>
        :root {
          --bg-color: #1e1b4b;
          --glass-bg: rgba(49, 46, 129, 0.6);
          --glass-border: rgba(255, 255, 255, 0.1);
          --primary-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
          --text-main: #f8fafc;
          --text-muted: #cbd5e1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: var(--bg-color);
          background-image:
            radial-gradient(circle at 85% 50%, rgba(245, 158, 11, 0.15), transparent 25%),
            radial-gradient(circle at 15% 30%, rgba(217, 119, 6, 0.15), transparent 25%);
          font-family: 'Outfit', sans-serif;
          color: var(--text-main);
          overflow: hidden;
        }

        .container {
          position: relative;
          z-index: 10;
          animation: float 6s ease-in-out infinite reverse;
        }

        .glass-card {
          background: var(--glass-bg);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid var(--glass-border);
          border-radius: 24px;
          padding: 3rem 4rem;
          text-align: center;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(245, 158, 11, 0.2);
          max-width: 600px;
          width: 90%;
          margin: 0 auto;
          position: relative;
          overflow: hidden;
        }

        .glass-card::before {
          content: '';
          position: absolute;
          top: 0; left: -100%; width: 50%; height: 100%;
          background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.05), transparent);
          transform: skewX(-20deg);
          animation: shine 8s infinite;
          animation-delay: 2s;
        }

        .status-badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: rgba(245, 158, 11, 0.15);
          border: 1px solid rgba(245, 158, 11, 0.3);
          color: #fbbf24;
          font-size: 0.85rem;
          font-weight: 600;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          padding: 8px 20px;
          border-radius: 999px;
          margin-bottom: 2rem;
          box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }

        .pulse {
          width: 8px; height: 8px;
          background-color: #fbbf24;
          border-radius: 50%;
          box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7);
          animation: pulse-animation 2s infinite;
        }

        h1 {
          font-size: 5rem;
          font-weight: 800;
          background: var(--primary-gradient);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 0.5rem;
          line-height: 1.1;
          filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        .subtitle {
          font-size: 1.25rem;
          color: var(--text-main);
          font-weight: 300;
          margin-bottom: 2.5rem;
          opacity: 0.9;
        }

        .metrics-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 1.5rem;
          margin-top: 1rem;
        }

        .metric-box {
          background: rgba(0, 0, 0, 0.2);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 16px;
          padding: 1.25rem;
          transition: transform 0.3s ease, background 0.3s ease;
        }

        .metric-box:hover {
          transform: translateY(-5px);
          background: rgba(255, 255, 255, 0.03);
          border-color: rgba(245, 158, 11, 0.3);
        }

        .metric-label {
          font-size: 0.8rem;
          color: var(--text-muted);
          text-transform: uppercase;
          letter-spacing: 1px;
          margin-bottom: 0.5rem;
        }

        .metric-value {
          font-size: 1.5rem;
          font-weight: 600;
          color: #f8fafc;
        }

        .weight-value { color: #fbbf24; }

        @keyframes float {
          0% { transform: translateY(0px); }
          50% { transform: translateY(-15px); }
          100% { transform: translateY(0px); }
        }

        @keyframes pulse-animation {
          0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
          70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
          100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }

        @keyframes shine {
          0% { left: -100%; }
          20% { left: 200%; }
          100% { left: 200%; }
        }

        @media (max-width: 640px) {
          h1 { font-size: 3.5rem; }
          .glass-card { padding: 2rem; }
          .metrics-grid { grid-template-columns: 1fr; gap: 1rem; }
        }
      </style>
    </head>
    <body>
      <div class="container">
        <div class="glass-card">
          <div class="status-badge">
            <div class="pulse"></div>
            🐦 Canary Release
          </div>

          <h1>v2.0.1</h1>
          <p class="subtitle">NGINX Gateway API Canary Setup</p>

          <div class="metrics-grid">
            <div class="metric-box">
              <div class="metric-label">Version</div>
              <div class="metric-value">Canary</div>
            </div>
            <div class="metric-box">
              <div class="metric-label">Traffic Weight</div>
              <div class="metric-value weight-value">40%</div>
            </div>
          </div>
        </div>
      </div>
    </body>
    </html>
