apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-canary
  labels:
    app: canary-nginx
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canary-nginx
      version: canary
  template:
    metadata:
      labels:
        app: canary-nginx
        version: canary
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: html
          configMap:
            name: nginx-canary-html
            items:
              - key: index.html
                path: index.html
        - name: nginx-conf
          configMap:
            name: nginx-canary-html
            items:
              - key: nginx.conf
                path: nginx.conf
